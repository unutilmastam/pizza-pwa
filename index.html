<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>Pitsa — yetkazib berish</title>
  <meta name="description" content="Issiq pitsa 35 daqiqada. Menyu, savat, buyurtma va yetkazib berish trekingi.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pitsa">
  <link rel="apple-touch-icon" href="./icons/icon.svg">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="app-header">
    <a class="app-header__brand" href="#/menu">
      <img class="app-header__logo" src="./icons/icon.svg" alt="" aria-hidden="true">
      <span data-i18n="app.name">Pitsa</span>
    </a>
    <span class="app-header__spacer"></span>
    <button class="icon-btn" id="langBtn" type="button" aria-label="Til" title="Til">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"></path>
      </svg>
    </button>
  </header>

  <div class="offline-bar" id="offlineBar" hidden data-i18n="app.offline">Internet yo'q. Oflayn rejim.</div>

  <main class="app-main" id="app"></main>

  <nav class="app-nav" aria-label="Asosiy navigatsiya">
    <a class="app-nav__item" href="#/menu" data-route="/menu">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h16"></path>
        <path d="M12 4a8 8 0 0 1 8 8H4a8 8 0 0 1 8-8z"></path>
        <path d="M9 9h.01M13 11h.01M15 8h.01"></path>
      </svg>
      <span data-i18n="nav.menu">Menyu</span>
    </a>
    <a class="app-nav__item" href="#/cart" data-route="/cart">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5h2l2.2 10.4a2 2 0 0 0 2 1.6h6.9a2 2 0 0 0 2-1.5L21 8H7"></path>
        <circle cx="10" cy="20" r="1.2"></circle>
        <circle cx="18" cy="20" r="1.2"></circle>
      </svg>
      <span data-i18n="nav.cart">Savat</span>
      <span class="app-nav__badge" id="cartBadge" hidden>0</span>
    </a>
    <a class="app-nav__item" href="#/orders" data-route="/orders">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path>
        <path d="M14 3v5h5M9 13h6M9 17h4"></path>
      </svg>
      <span data-i18n="nav.orders">Buyurtmalar</span>
    </a>
    <a class="app-nav__item" href="#/profile" data-route="/profile">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8.5" r="3.5"></circle>
        <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
      </svg>
      <span data-i18n="nav.profile">Profil</span>
    </a>
  </nav>

  <script type="module">
    // Ilova karkasini ishga tushirish. Sahifalar routerga ro'yxatdan o'tadi;
    // keyingi bosqichlarda bu yerdagi loader'lar haqiqiy modullarga almashadi.
    import { initState, subscribe, cartCount, setLang } from './js/state.js';
    import { applyI18n, t, LANGS, getLang } from './js/i18n.js';
    import { register, registerNotFound, start } from './js/router.js';
    import { emptyState, el, bottomSheet, toast } from './js/ui.js';

    initState();
    applyI18n();

    /**
     * 0-bosqich uchun vaqtinchalik sahifa — bo'lim keyingi bosqichda to'ladi.
     * @param {string} titleKey
     * @param {string} icon
     */
    const stubPage = (titleKey, icon) => () => ({
      render: () => el('div.page', {}, [
        emptyState({ icon, title: t(titleKey), hint: t('app.emptyStage') })
      ])
    });

    register('/', () => import('./js/pages/menu.js'));
    register('/menu', () => import('./js/pages/menu.js'));
    register('/cart', () => import('./js/pages/cart.js'));
    register('/checkout', () => import('./js/pages/checkout.js'));
    register('/address', () => import('./js/pages/address.js'));
    register('/orders', stubPage('order.title', '🧾'));
    register('/profile', stubPage('profile.title', '👤'));
    registerNotFound(() => ({
      render: () => el('div.page', {}, [
        emptyState({ icon: '🤷', title: t('app.notFound'), hint: location.hash })
      ])
    }));

    start(document.getElementById('app'), { fallback: '/menu' });

    // Pastki navdagi faol bo'limni belgilash
    const navItems = [...document.querySelectorAll('.app-nav__item')];
    document.addEventListener('route:change', (e) => {
      const path = e.detail.path === '/' ? '/menu' : e.detail.path;
      navItems.forEach((item) => {
        item.classList.toggle('is-active', path.startsWith(item.dataset.route));
      });
    });

    // Savat badge — holat o'zgarganda yangilanadi
    const badge = document.getElementById('cartBadge');
    subscribe(() => {
      const count = cartCount();
      badge.textContent = String(count);
      badge.hidden = count === 0;
    });

    // Til tanlash
    document.getElementById('langBtn').addEventListener('click', () => {
      const list = el('div.page');
      LANGS.forEach((lang) => {
        list.append(el('button.btn.btn--block', {
          text: `${lang.flag}  ${lang.label}`,
          attrs: { type: 'button', 'aria-current': lang.code === getLang() ? 'true' : null },
          on: {
            click: () => {
              setLang(lang.code);
              applyI18n();
              sheet.close();
              location.reload();
            }
          }
        }));
      });
      const sheet = bottomSheet({ title: t('profile.lang'), content: list });
    });

    // Tarmoq holati
    const offlineBar = document.getElementById('offlineBar');
    const syncNetwork = () => {
      offlineBar.hidden = navigator.onLine;
    };
    window.addEventListener('online', () => {
      syncNetwork();
      toast(t('app.online'), { type: 'success' });
    });
    window.addEventListener('offline', syncNetwork);
    syncNetwork();

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((e) => {
          console.warn('SW ro\'yxatdan o\'tmadi:', e);
        });
      });
    }
  </script>
</body>
</html>
