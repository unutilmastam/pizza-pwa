<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14171c">
  <title>Pitsa — admin</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/admin.css">

  <!--
    MODUL GRAFIGINI YASSILASH.

    ES modul importlari DARAJA-DARAJA yuklanadi: brauzer `app.js` ni
    olib, uni tahlil qilib, keyin uning importlarini so'raydi. Sekin
    tarmoqda har daraja bir to'liq borib-kelish (RTT).

    O'lchov (1.5 s/so'rov): admin panel 10.9 sekundda ochilardi va
    zanjir shunday edi —
      index.html → app.js → (router, config, i18n, ui, auth, api, db)
      → ../../js/config.js → gstatic Firebase SDK → getDoc(staff)
    ya'ni OLTI daraja, oltita RTT.

    `modulepreload` brauzerga hammasini HTML tahlilidayoq, PARALLEL
    so'rashni aytadi — darajalar yig'ilib bitta to'lqinga aylanadi.
    Yangi fayl qo'shilsa shu ro'yxatga ham qo'shing.
  -->
  <link rel="modulepreload" href="./js/app.js">
  <link rel="modulepreload" href="./js/config.js">
  <link rel="modulepreload" href="./js/i18n.js">
  <link rel="modulepreload" href="./js/ui.js">
  <link rel="modulepreload" href="./js/db.js">
  <link rel="modulepreload" href="./js/api.js">
  <link rel="modulepreload" href="./js/auth.js">
  <link rel="modulepreload" href="./js/pages/login.js">
  <link rel="modulepreload" href="../js/router.js">
  <link rel="modulepreload" href="../js/config.js">
  <link rel="modulepreload" href="../js/i18n.js">
  <link rel="modulepreload" href="../js/cache.js">

  <!--
    Firebase SDK gstatic'dan keladi va service worker uni keshlay
    olmaydi (cross-origin). U kritik yo'lda turgani uchun ulanishni
    OLDINDAN ochamiz va modulni oldindan so'raymiz — aks holda u
    zanjirning 5-darajasida kutib turadi.
  -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
</head>
<body>
  <div class="admin" id="admin" hidden>
    <aside class="side" id="side">
      <div class="side__head">
        <span class="side__logo" aria-hidden="true">🍕</span>
        <span class="side__title" data-i18n="app.title">Pitsa — admin</span>
      </div>
      <nav class="side__nav" id="sideNav" aria-label="Bo'limlar"></nav>
      <div class="side__foot">
        <p class="side__staff" id="staffLine"></p>
        <div class="side__actions">
          <button class="btn btn--ghost btn--sm" id="langBtn" type="button">UZ</button>
          <button class="btn btn--ghost btn--sm" id="themeBtn" type="button" aria-label="Mavzu">◐</button>
          <button class="btn btn--ghost btn--sm" id="logoutBtn" type="button" data-i18n="auth.logout">Chiqish</button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menuBtn" type="button" aria-label="Menyu">☰</button>
        <h1 class="topbar__title" id="pageTitle"></h1>
        <div class="topbar__right" id="topbarSlot"></div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>

    <div class="side-backdrop" id="sideBackdrop" hidden></div>
  </div>

  <div class="boot" id="boot">
    <div class="boot__spinner" aria-hidden="true"></div>
    <p class="boot__text">Yuklanmoqda…</p>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    // Admin panelning o'z SW'i — tarmoq birinchi. Ildizdagi SW ning
    // scope'i kengroq, lekin brauzer eng aniq mos keluvchisini tanlaydi.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((e) => {
          console.warn('Admin SW ro\'yxatdan o\'tmadi:', e);
        });
      });
    }
  </script>
</body>
</html>
